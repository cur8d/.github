name: Bug Report
description: File a bug report to help improve cur8d templates and tools
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Affected Template or Component
      description: e.g. cur8d/typescript, cur8d/python, cur8d/lambda, create-cur8d
      placeholder: cur8d/typescript
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node/Python/uv/mise versions, browser if applicable.
      placeholder: |
        - OS: macOS / Ubuntu / Windows
        - Tool versions: node 24, python 3.14, mise
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
